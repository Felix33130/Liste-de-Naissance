<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liste de naissance</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f7f0e5;
      font-family: "Marker Felt", "Chalkboard SE", "Noteworthy", cursive;
    }

    .gift {
      position: relative;
      width: min(420px, 100%);
      margin: 0;
      padding: 0;
      overflow: hidden;
      cursor: pointer;
      text-align: center;
      background: transparent;
      border: 0;
      box-shadow: none;
      -webkit-tap-highlight-color: transparent;
    }

    .gift img,
    .gift canvas {
      display: block;
      width: 100%;
      height: auto;
      border: 0;
      border-radius: 0;
    }

    .gift canvas { display: none; }
    .gift.checked img { display: none; }
    .gift.checked canvas { display: block; }

    .gift h1 {
      margin: 14px 0 0;
      color: #9b5f4a;
      font-family: "Marker Felt", "Chalkboard SE", "Noteworthy", cursive;
      font-size: clamp(1.8rem, 6vw, 2.4rem);
      font-weight: normal;
    }

    .gift.checked {
      filter: grayscale(100%);
      opacity: 0.55;
    }

    .cross {
  display: none;
  position: absolute;
  z-index: 10;
  inset: 0;
  pointer-events: none;
}

.gift.checked .cross {
  display: block;
}

.cross span {
  position: absolute;
  top: 46%;
  left: 4%;
  width: 92%;
  height: 15px;
  background: #d73524;
  border-radius: 60% 40% 55% 45%;
}

.cross span:first-child {
  transform: rotate(34deg);
}

.cross span:last-child {
  height: 12px;
  transform: rotate(-31deg);
}

    .gift.checked::after {
      height: 12px;
      transform: rotate(-31deg) translateY(5px);
    }
  </style>
</head>
<body>
  <article class="gift" id="cadeau" role="button" tabindex="0" aria-pressed="false">
  <img id="gif" src="brosse_cheveux.gif" alt="Brosse à cheveux">

  <canvas id="image-figee" aria-hidden="true"></canvas>

  <div class="cross" aria-hidden="true">
    <span></span>
    <span></span>
  </div>

  <h1>Brosse à cheveux</h1>
</article>
  <script>
    const SUPABASE_URL = "COLLE_ICI_API_URL";
    const SUPABASE_KEY = "COLLE_ICI_PUBLISHABLE_KEY";

    const cadeau = document.getElementById("cadeau");
    const gif = document.getElementById("gif");
    const imageFigee = document.getElementById("image-figee");
    let actionEnCours = false;

    function figerGif() {
      if (!gif.complete || !gif.naturalWidth) return;
      imageFigee.width = gif.naturalWidth;
      imageFigee.height = gif.naturalHeight;
      imageFigee.getContext("2d").drawImage(gif, 0, 0);
    }

    function afficherEtat(reserved)
  if (!reserved) {
    cadeau.classList.remove("checked");
    cadeau.setAttribute("aria-pressed", "false");
    return;
  }

  if (gif.complete && gif.naturalWidth) {
    figerGif();
    cadeau.classList.add("checked");
    cadeau.setAttribute("aria-pressed", "true");
  } else {
    gif.addEventListener("load", function attendreGif() {
      figerGif();
      cadeau.classList.add("checked");
      cadeau.setAttribute("aria-pressed", "true");
    }, { once: true });
  }
}

    async function lireEtat() {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/gifts?id=eq.brosse_cheveux&select=reserved`,
        { headers: { apikey: SUPABASE_KEY } }
      );

      if (!response.ok) return;
      const lignes = await response.json();
      if (lignes.length) afficherEtat(lignes[0].reserved === true);
    }

    async function changerEtat() {
      if (actionEnCours) return;

      const estBarre = cadeau.classList.contains("checked");
      const nouvelEtat = !estBarre;
      const message = nouvelEtat
        ? "Barrer ce cadeau ?"
        : "Rendre ce cadeau de nouveau disponible ?";

      if (!window.confirm(message)) return;
      actionEnCours = true;

      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/gifts?id=eq.brosse_cheveux`,
          {
            method: "PATCH",
            headers: {
              apikey: SUPABASE_KEY,
              "Content-Type": "application/json",
              Prefer: "return=minimal"
            },
            body: JSON.stringify({ reserved: nouvelEtat })
          }
        );

        if (!response.ok) throw new Error("Mise à jour refusée");
        afficherEtat(nouvelEtat);
      } catch (erreur) {
        window.alert("La modification n'a pas pu être enregistrée.");
      } finally {
        actionEnCours = false;
      }
    }

    cadeau.addEventListener("click", changerEtat);
    cadeau.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        changerEtat();
      }
    });

    gif.addEventListener("load", lireEtat);
    lireEtat();
    setInterval(lireEtat, 3000);
  </script>
</body>
</html>
