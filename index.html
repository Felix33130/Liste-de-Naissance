<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Liste de naissance</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f7f0e5;
      font-family: "Marker Felt", "Chalkboard SE", cursive;
    }

    .gift {
      position: relative;
      width: min(420px, 100%);
      margin: 0;
      padding: 0;
      overflow: hidden;
      cursor: pointer;
      text-align: center;
      background: transparent;
      border: none;
      box-shadow: none;
      -webkit-tap-highlight-color: transparent;
    }

    .gift img,
    .gift canvas {
      display: block;
      width: 100%;
      height: auto;
      border: none;
      border-radius: 0;
    }

    .gift canvas {
      display: none;
    }

    .gift.checked img {
      display: none;
    }

    .gift.checked canvas {
      display: block;
    }

    .gift h1 {
      margin: 14px 0 0;
      color: #9b5f4a;
      font-family: "Marker Felt", "Chalkboard SE", cursive;
      font-size: clamp(1.8rem, 6vw, 2.4rem);
      font-weight: normal;
    }

    .gift.checked {
      filter: grayscale(100%);
      opacity: 0.55;
      cursor: default;
    }

    /* Croix rouge irrégulière, façon feutre enfant */
    .gift.checked::before,
    .gift.checked::after {
      content: "";
      position: absolute;
      z-index: 2;
      top: 46%;
      left: 4%;
      width: 92%;
      height: 15px;
      background: #d73524;
      border-radius: 60% 40% 55% 45%;
      box-shadow:
        0 2px 0 rgba(150, 20, 15, 0.25),
        0 -2px 0 rgba(255, 100, 70, 0.25);
      pointer-events: none;
    }

    .gift.checked::before {
      transform: rotate(34deg) translateY(-4px);
    }

    .gift.checked::after {
      height: 12px;
      transform: rotate(-31deg) translateY(5px);
    }
  </style>
</head>

<body>

  <article
    class="gift"
    id="cadeau"
    role="button"
    tabindex="0"
    aria-pressed="false"
  >
    <img
      eux.gif

    <canvas
      id="image-figee"
      aria-hidden="true"
    ></canvas>

    <h1>Brosse à cheveux</h1>
  </article>

  <script>
    const SUPABASE_URL = "https://pbtvxdmvyfwjtebgyerr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Pgn4b2AecYIBNQ3gyUXiXQ_9HcVgJA0";

    const cadeau = document.getElementById("cadeau");
    const gif = document.getElementById("gif");
    const imageFigee = document.getElementById("image-figee");

    function figerGif() {
      if (!gif.complete || !gif.naturalWidth) {
        return;
      }

      imageFigee.width = gif.naturalWidth;
      imageFigee.height = gif.naturalHeight;

      imageFigee
        .getContext("2d")
        .drawImage(gif, 0, 0);
    }

    function afficherEtat(reserved) {
      if (reserved) {
        figerGif();
      }

      cadeau.classList.toggle("checked", reserved);
      cadeau.setAttribute("aria-pressed", String(reserved));
    }

    async function lireEtat() {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/gifts?id=eq.brosse_cheveux&select=reserved`,
        {
          headers: {
            apikey: SUPABASE_KEY
          }
        }
      );

      if (!response.ok) {
        return;
      }

      const lignes = await response.json();

      if (lignes.length > 0) {
        afficherEtat(lignes[0].reserved === true);
      }
    }

    async function cocherCadeau() {
      if (cadeau.classList.contains("checked")) {
        return;
      }

      const confirmation = window.confirm(
        "Barrer définitivement ce cadeau ?"
      );

      if (!confirmation) {
        return;
      }

      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/gifts?id=eq.brosse_cheveux`,
        {
          method: "PATCH",

          headers: {
            apikey: SUPABASE_KEY,
            "Content-Type": "application/json",
            Prefer: "return=minimal"
          },

          body: JSON.stringify({
            reserved: true
          })
        }
      );

      if (response.ok) {
        afficherEtat(true);
      } else {
        window.alert(
          "La réservation n'a pas pu être enregistrée."
        );
      }
    }

    cadeau.addEventListener("click", cocherCadeau);

    cadeau.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        cocherCadeau();
      }
    });

    gif.addEventListener("load", lireEtat);

    lireEtat();

    setInterval(lireEtat, 3000);
  </script>

</body>
</html>
